# UDP receive buffer tuning for the Janus streaming ingest on the Control Station.
#
# The cameras send H.264 over RTP/UDP. With the kernel default receive buffer
# (~208 KB) bursty traffic - e.g. a large keyframe across 4 streams - overflows
# the socket buffer before Janus drains it. The dropped datagrams show up as
# UDP RcvbufErrors in /proc/net/snmp and appear to the user as intermittent
# frozen / laggy video until the next keyframe arrives.
#
# Raising the receive buffer ceiling (and default) gives the socket headroom to
# absorb those bursts. 16 MB max / 4 MB default is comfortable for a handful of
# 720p/1080p H.264 streams.
net.core.rmem_max = 16777216
net.core.rmem_default = 4194304
